version: '2.9'
domain: bullets
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: bullets_budget
  type: editorial
  source_id: skill_editorial_v2
  prompt_fragment: 固定交付 5 条。普通文案每条 250、合计 1250 字符是本技能编辑预算；引用了已确认 compatible_models 事实的型号及清单分隔符另计，不为此删型号。上架原文完整提交后端，真实类目字段限制仍须核对；冲突时保留完整稿及真实失败状态，不把本地预算例外当成平台无限长许可。
  limit_refs:
  - default_limits.bullets_count
  - default_limits.bullet_max_chars
  - default_limits.bullets_total_max_chars
- id: bullets_format
  type: editorial
  source_id: user_writing_sop_20261118
  prompt_fragment: 使用自然日语的「短主题：具体说明」，可用全角或半角冒号；兼容旧稿【主题】正文。相关可用搜索词自然放在短主题或首句开头，型号和Ag+等写法不强制大写。去除模板占位符和教学文字，不写退款／无条件保证、联系方式、价格或促销；不以夸张品质口号代替客观信息。
- id: bullets_decision_order
  type: editorial
  source_id: user_writing_sop_20261118
  prompt_fragment: 默认顺序为型号与套装、性能与使用价值、适配、更换条件、品质与购买事项。按本品资料和购买判断调整；长适配名单仍可连续占2–3条并合并其余主题，完整性优先；缺乏某主题依据时以其他真实购买信息替代，记录缺口，不虚构卖点。已有竞品结论只用于选题，不强制重新调研。
- id: bullets_complete_compatibility
  type: required
  source_id: user_compatibility_lists_20261112
  prompt_fragment: 有适配资料的配件／耗材须按 references/consumables.md 在五点完整列出所有已确认 compatible_models。每个型号保持完整，含所有实际后缀；按系列／来源组分配 2–3 条，不用シリーズなど、省略号、范围或仅热门型号替代，不把完整名单只放长描或图片。型号是事实枚举，不须逐个具有关键词流量。核对本品清单的缺失、额外机型、来源和范围，五点 claims 引用对应机型事实。
- id: bullets_evidence_benefit
  type: required
  source_id: user_writing_sop_20261118
  prompt_fragment: 已确认结构／规格／测试结果解释对应用途或价值，有什么依据写到什么强度；用途不升级为性能，设备效果或竞品评价不变成本品效果。更换迹象、周期、寿命和品质检验只写给定资料明示的内容；未知时记录缺口。数字规格引用事实或measurement_ids，实际数量、配件数量和套数分开。
- id: bullets_questions
  type: editorial
  source_id: user_writing_sop_20261118
  prompt_fragment: 每条回答具体购买问题，避免重复介绍身份或空泛确认。品质／购买信任用前文未展开的真实规格、检验或安装信息承接，不编售后承诺。竞品评论用于发现问题，本品资料和可信关键词决定答案；未表达的事实不补造。
