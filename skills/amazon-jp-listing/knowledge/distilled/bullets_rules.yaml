version: '2.4'
domain: bullets
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: bullets_budget
  type: editorial
  source_id: skill_editorial_v2
  prompt_fragment: 固定交付 5 条。普通文案每条 250、合计 1250 字符是本技能编辑预算；引用了已确认 compatible_models 事实的型号及清单分隔符另计，不为此删型号。上架原文完整提交后端，真实类目字段限制仍须核对；冲突时保留完整稿及真实失败状态，不把本地预算例外当成平台无限长许可。
  limit_refs:
  - default_limits.bullets_count
  - default_limits.bullet_max_chars
  - default_limits.bullets_total_max_chars
- id: bullets_format
  type: required
  source_id: user_delivery_media_v21
  prompt_fragment: 格式为【相关搜索词／主题标签】正文，优先让标签包含该主题的 eligible 搜索词；标签过长时将词自然放到首句开头。日文标签保留真实关键词和型号写法，含 Ag+ 等拉丁字母也不强制大写。不用 ™ ® © 或 emoji（warning），不写退款保证、联系方式或 ASIN。
- id: bullets_decision_order
  type: editorial
  source_id: user_mobile_layout_20261112
  prompt_fragment: 每条开头优先相关流量词，再接真实卖点或购买问题。替换滤网等适配型耗材以完整机型清单优先，通常占 2–3 条，短名单可占 1 条，允许同一适配主题按系列分多条；开头结合相关词与対応機種①／②／③，不强求五种不同卖点。其余条目容纳材质、尺寸、包装和保养。非机型清单条目继续避免无意义重复、通用空标签及虚构用途。
- id: bullets_complete_compatibility
  type: required
  source_id: user_compatibility_lists_20261112
  prompt_fragment: 有适配资料的配件／耗材须按 references/compatibility-lists.md 在五点完整列出所有已确认 compatible_models。每个型号保持完整，含 E3／E4 等后缀；按系列／来源组分配 2–3 条，不用シリーズなど、省略号、范围或仅热门型号替代，不把完整名单只放长描或图片。型号是事实枚举，不须逐个具有关键词流量。核对本品清单的缺失、额外机型、来源和范围，五点 claims 引用对应机型事实。
- id: bullets_intent_relations
  type: editorial
  source_id: cosmo_paper
  prompt_fragment: 适配清单条目直接分组逐项列出机型，不强套能力／场景句式；其他卖点写清"能力 → 依据 → 适用场景"，并用自然语句带出 intent_map 中的关系：用途（for …）、人群（ideal for …）、地点（in the …）、时节或场合、搭配（pairs
    with …）、身体部位。COSMO 用这类产品与意图的关系做相关性、导航和推荐；"写出来就加分"是推断，所以只写已确认的关系。
- id: bullets_evidence_benefit
  type: required
  source_id: user_product_identity
  prompt_fragment: 说明真实属性如何支持合理的使用价值。不能从铝材推出承重、从可调角度推出缓解颈痛、从棉质推出耐洗。含数字或规格时引用 confirmed 事实或 measurement_ids，缺证据就不写承诺。
- id: bullets_questions
  type: editorial
  source_id: amazon_rufus_attributes
  prompt_fragment: 优先回答 question_reviews 中相关且有事实支持的问题，以及 5W1H 中最关键的问题；相关但无答案资料的问题记为 unsupported，不补造答案。
