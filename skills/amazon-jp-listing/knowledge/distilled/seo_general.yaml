version: '2.8'
domain: general
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: grounded_identity
  type: required
  source_id: user_product_identity
  prompt_fragment: 品名和必保短语保留本品身份。给定关键词中的明确属性可作为用户依据；兼容品牌只描述适配对象，泛词不推出未给出的参数或承诺。
- id: coordinated_placement
  type: editorial
  source_id: user_mobile_layout_20261112
  prompt_fragment: 标题、Highlight、五点、长描和后台词协同安排相关词；按真实指标和购买意图排序。coverage 用于发现遗漏，不追求满字节或机械覆盖率。
- id: buyer_information
  type: editorial
  source_id: skill_ai_answerability
  prompt_fragment: 属性建议和买家问题覆盖真实购买判断；有依据才写答案，未知时记未声明，不凑问题数量。图片的重要规格同步写入正文，图上嵌字不当作索引保证。
- id: semantic_review
  type: required
  source_id: skill_editorial_v2
  prompt_fragment: 机器检查负责结构、数值与引用；内容复核对照原资料检查日语、身份、实际用词、适配和画面。逐项记录依据与问题，文件生成不等于验收通过；独立复审者按需要使用。
