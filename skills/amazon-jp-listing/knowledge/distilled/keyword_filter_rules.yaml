version: '1.3'
domain: keyword_filter
contract_ref: ../data_contract.md
sources_ref: ../sources.json
rules:
- id: trust_provided_keywords
  type: required
  source_id: user_trusted_keywords_20261112
  prompt_fragment: 用户给定keywords默认正确且与本品相关，不重新做真伪或相关性核验，不要求官网／说明书再次证明。按含义分组、标角色并安排字段；语义明确的适配对象标识直接成为confirmed适配事实。用户资料中的具体冲突、明确否定和无法解析须指出原文位置，不能把缺少独立外部证明当作暂缓理由。
- id: unified_keyword_ledger
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 三类词池只通过 keyword_quality.py prepare/apply/check/export 建立和导出。03_keyword_decisions 的逐词记录是唯一分类依据；调整分类时保留 initial_decision 并写 resolution。模型负责完整语义判断，程序负责覆盖、边界、引用和隔离。禁止用临时白名单或子串正则删词，不做剔除词第二轮复核。
- id: intent_group_judgement
  type: required
  source_id: user_keyword_audit_v12
  prompt_fragment: 读 03_keyword_view.tsv（按搜索量、覆盖竞品数、购买率排序）；词量较大时用 view --clusters 生成词面候选分组，逐组阅读成员后在 groups 中用 "@c001" 引用整组，例外词写入 except 再归入正确的组。候选分组只是阅读辅助，不是分类结论。完整搜索意图相同的词归为一组，每组写一次判断，再由 apply 复制到每个成员；组内个别词判断不同时用 overrides 并写 group_difference。按意图归组，不能按片段或排序后的词袋归组。逐词账本和全部 check 规则不变。
- id: complete_intent_before_decision
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 在信任原词正确的前提下理解完整搜索对象与修饰关系，区分角色和投放位置。编号、数量和容量只是线索，要结合本品身份、完整修饰关系与字段标签区分本品、适配对象、规格及用途，不按前缀或词片段判断。
- id: three_pools
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 给定原词默认 eligible，用户输入本身是依据；deferred 仅用于无法解析或具体输入冲突，须写具体问题及处理条件，不得进入正文、后台、图片文案或 QA 请求；excluded 要写具体剔除理由。没有流量不是无关的证据。给定词含兼容品牌时只按兼容语义安排，不冒称自有品牌、原装或授权；后台字段的品牌限制单独处理，不因此删掉整行中的适配型号。
- id: unknown_not_conflicting
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 给定词若明确表达材质、用途或适配对象标识，可按用户资料直接采用，不要求产品说明书重复确认。只有泛词没有表达的具体性能／等级不得推导；无法解析或与用户其他资料有具体冲突时记录问题，不能因缺外部资料重做可信词审核。
- id: lexical_normalization_boundary
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 保留原词和原始位置，只做 NFKC、大小写、空白和标点形式的规范化，不删否定词、数字、单位或词序。保留重音、中文、日文等有效文字。核心品名在原词中缺席时由工具补登，无流量时保持未知。
- id: scope_and_placement
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 相关性与投放字段相互独立，不适合标题不等于无关。只采用本品有依据的属性与用途。后台词不是暂缓词的收容处。
- id: honest_acceptance
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 完成条件包括数量守恒、分类完整、导出一致，以及最终文案与关键词一致性复审。不设保留率配额。画像在筛词后改动时用 rebind 只复核受影响的词，指纹失效不能标通过。
