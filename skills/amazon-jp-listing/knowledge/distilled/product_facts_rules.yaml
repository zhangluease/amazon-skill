version: '2.2'
domain: product_facts
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: facts_source
  type: required
  source_id: user_product_identity
  prompt_fragment: product_identity 保留原始名称、目标语言名称和完整必保短语。facts 记录 fact_id、field、value、source_ref 以及 confirmed/unknown/conflict
    状态。图中能看清的外观可以作为证据，但不能据此补造材质牌号、规格、性能或认证。
- id: measurements_source
  type: required
  source_id: user_unit_localization
  prompt_fragment: 每个参数保存原始十进制字符串、单位、subject、label、kind 和来源；产品、包装、适配对象分开记录。缺单位或数值时不默认；影响标题或子体识别的未知参数须先补全。
- id: us_units
  type: required
  source_id: nist_length_conversion
  prompt_fragment: 本技能固定日本站，保留来源中的单位，由 normalize 统一计算展示值。原值、单位、参数对象和引用全程保留，不进行美国站单位换算。
- id: measurement_exceptions
  type: required
  source_id: user_unit_localization
  prompt_fragment: nominal 与 size 保留公称规格和尺码，不换算。oz 不能当 fl oz 用。数量、型号和包装尺寸不能当成产品尺寸。随附配件数量用 accessory_count 登记，与购买数量分开。
- id: measurement_reuse
  type: required
  source_id: user_unit_localization
  prompt_fragment: 标题、Highlight、正文和图片文字都从同一个 measurement_id 引用 display_text，不各自重算。子体属性只能引用根级或本子体的参数。
- id: intent_map
  type: required
  source_id: cosmo_paper
  prompt_fragment: 把已确认的产品与意图关系写进 intent_map：function/capability（用途/能做什么）、activity（活动/事件）、audience（人群）、location（地点）、season（季节/场合）、body_part、companion（搭配品）、product_type（别称/上位类）、interest。每项写一个目标语言
    expression 并引用依据；资料没有的关系不写。
- id: claim_evidence
  type: required
  source_id: user_product_identity
  prompt_fragment: 每个前台字段都要有 claims 记录：含规格的列 measurement_ids，其他可核查声明列 confirmed 且有来源的 fact_ids。引用为空的普通场景文字由语义复审说明。
