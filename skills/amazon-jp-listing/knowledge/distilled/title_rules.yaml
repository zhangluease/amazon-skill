version: '2.11'
domain: title
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: title_identity_first
  type: required
  source_id: user_product_identity
  prompt_fragment: 标题必须完整保留 product_identity.protected_terms，即使核心名称没有出现在关键词来源（扩词结果或用户表格）中、或流量未知，也不得降级、拆散或换成后台类目枚举。配件必须保留配件身份，不能写成主机或套装。
- id: title_budget
  type: required
  source_id: amazon_title_2026
  prompt_fragment: 仅生成新版日本站标题，非媒体类最多 75 字符，含空格，全角半角均按一个字符。保留完整核心品名及必要的品牌和型号；普通材质、尺寸放五点正文，不能以必要规格为由占满标题。
  limit_ref: default_limits.title_max_chars
- id: title_compliance
  type: required
  source_id: amazon_title_rules_2025
  prompt_fragment: 不使用 ! $ ? _ { } ^ ¬ ¦（品牌名自带的除外，机器检查为 error）；同一个词最多出现 2 次，介词、冠词、连词除外（warning）；不写促销语、价格或主观夸赞。
- id: title_keyword_coverage
  type: editorial
  source_id: user_mobile_layout_20261112
  prompt_fragment: 先按完整购买意图确认 eligible，再按词表真实搜索量及来源指标选高相关流量词，尽量在标题前 35–40 字符自然交代商品身份、核心品名、关键编号和必要兼容关系；品牌已知时保留。前 35–40 字符为编辑目标，保留完整品名与编号及自然语序。普通材质尺寸不挤占流量词，不为凑满 75 字符添参数；未知指标不冒充高流量，核心品名无流量也保留。未选的重要词说明原因，其他相关词放小标题、五点或后台。写完脱离词表重读，确保配件不被误认成主机。
- id: title_localization
  type: required
  source_id: user_unit_localization
  prompt_fragment: 遵循自然日语的标点和语序。尺寸使用规范化后的 display_text，并保持维度对应。型号和真实品牌保持原样。
- id: title_verified_claims
  type: required
  source_id: skill_editorial_v2
  prompt_fragment: 只写有来源的本品事实，给定词中明确的兼容关系按用户依据使用，兼容品牌只描述适配对象，不冒称本品品牌、原装或授权；输入未表达的健康效果等不推导。场景词只在有助于识别和购买判断时使用。
- id: title_identity_and_relation
  type: editorial
  source_id: user_title_highlight_layout_20261120
  prompt_fragment: 标题依次写真实本品品牌、主要目标品番、完整日文部件名、适用对象／用途、真实兼容关系。目标品番紧跟品牌，品牌缺失时目标品番置首。两项均按本品资料填写，缺失项记入报告。尽量把品牌、目标品番和完整品名放进前 35–40 字符。已确认兼容替换件时用互換品等准确措辞收尾。空间不足时先删同义叠词、次要品番及修饰，保留完整编号和品名。
