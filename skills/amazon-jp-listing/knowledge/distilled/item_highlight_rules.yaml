version: '2.3'
domain: item_highlight
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: highlight_scalar
  type: required
  source_id: user_single_product_20261112
  prompt_fragment: Item Highlight 始终是一个字符串（自然短句或短语），独立于 bullets；不另建 subtitle 字段，不把多条五点塞进来。
- id: highlight_budget
  type: required
  source_id: amazon_title_2026
  prompt_fragment: ≤125 字符（含空格）。对应新版标题下灰字小标题，可被搜索，在搜索结果和详情页与标题分开展示。目标类目不支持该字段时报告具体限制。
  limit_ref: default_limits.item_highlight_max_chars
- id: highlight_purchase_reason
  type: editorial
  source_id: user_mobile_layout_20261112
  prompt_fragment: 小标题先写有 confirmed 事实支持的实际包装数量与套装组成，单位按耗材使用枚／個／本／袋／巻／組等，再补标题未覆盖的相关词与用途；普通材质和尺寸留给五点正文。不把主商品加配件误写为同品多件装，数量未知不得默认 1 件装或抄竞品数量，记录缺口并使用其他已确认信息。不重复标题整句，不写成长段商品介绍。
